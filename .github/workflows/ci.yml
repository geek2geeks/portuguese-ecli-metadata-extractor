name: CI

# Public repository with a self-hosted Windows runner:
# only trusted pushes to the default branch and manual dispatches may run here.
# Pull-request triggers are deliberately absent so the local runner never
# executes untrusted PR code.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

defaults:
  run:
    shell: pwsh

jobs:
  python:
    name: Python 3.10 - install, dependency check, compile, import smoke
    runs-on: [self-hosted, Windows, X64, portuguese-ecli-metadata-extractor]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements_oneshot.txt
            database/requirements.txt

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_oneshot.txt -r database/requirements.txt

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Import smoke test - extractor module
        run: python -c "import ecli_extractor_oneshot; print('extractor import ok')"

      - name: Byte-compile every tracked Python file
        run: |
          $files = @(git ls-files '*.py')
          if ($files.Count -eq 0) { throw 'No tracked Python files found' }
          python -m compileall -q @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docker:
    name: Docker - compose validation and image build
    runs-on: [self-hosted, Windows, X64, portuguese-ecli-metadata-extractor]
    needs: python
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        env:
          DB_PASSWORD: ci-placeholder-not-a-secret
          PGADMIN_DEFAULT_PASSWORD: ci-placeholder-not-a-secret
        run: docker compose -f database/docker-compose.yml config --quiet

      - name: Remove previous CI image
        run: |
          $tag = 'portuguese-ecli-metadata-extractor:ci'
          docker image inspect $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            docker image rm --force $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # `docker image inspect` returns 1 when the image is absent; the runner's pwsh wrapper
          # would turn that last exit code into a step failure.
          exit 0

      - name: Build database image
        run: docker build --tag portuguese-ecli-metadata-extractor:ci database
